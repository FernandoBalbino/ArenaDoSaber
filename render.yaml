services:
  - type: web
    name: arena-do-saber
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: MAX_ROOMS
        value: "5"
      - key: TICK_RATE
        value: "10"
